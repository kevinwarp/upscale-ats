name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enrichment-service:
    name: Enrichment Service (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enrichment-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: enrichment-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t ats-enrichment-service:test .

  opencats-module:
    name: OpenCATS Module (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencats-module

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite
          tools: phpunit

      - name: Run PHP tests
        run: phpunit tests/

      - name: PHP syntax check
        run: |
          find src/ -name "*.php" -exec php -l {} \;
